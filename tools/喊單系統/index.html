<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>好事丞雙 團購查詢</title>
<meta name="description" content="好事丞雙團購：登入查詢自己的喊單、到貨與出貨狀態，也可以直接 +1。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&family=Oswald:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap narrow">
  <div class="stampwrap"><header class="top">
    <div class="chev" aria-hidden="true"></div>
    <div class="topin">
      <div class="brand">
        <div class="mark" aria-hidden="true">丞</div>
        <div><div class="eyebrow">RETRO POST ・ <span>好事丞雙 x 用插畫玩手作</span></div><h1>團購查詢<span class="plus">+1</span></h1></div>
      </div>
    </div>
    <div class="chev bottom" aria-hidden="true"></div>
  </header></div>

  <!-- 尚未登入 -->
  <section id="v-login" hidden>
    <div class="card dashed">
      <h3>登入查詢你的喊單</h3>
      <p class="hint">登入後可以看到你在社團喊的單、哪些商品到貨了、什麼時候出貨，也能直接 +1。</p>
      <button class="btn fb" id="fbLogin" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.95.93-1.95 1.88v2.26h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z"/></svg>
        用 Facebook 登入
      </button>
      <div class="or">或用手機號碼</div>
      <div class="filters" style="display:flex;gap:6px;margin-bottom:12px" role="tablist">
        <button class="chipbtn" id="mLogin" aria-pressed="true" type="button">登入</button>
        <button class="chipbtn" id="mSignup" aria-pressed="false" type="button">第一次使用</button>
      </div>
      <form id="phoneForm" novalidate>
        <div class="err" id="phoneErr" hidden></div>
        <div class="field">
          <label for="ph">手機號碼</label>
          <input class="input" id="ph" type="tel" inputmode="numeric" autocomplete="tel" placeholder="0912345678" required>
        </div>
        <div class="field" id="nameField" hidden>
          <label for="nm">你在社團的 FB 名字</label>
          <input class="input" id="nm" type="text" autocomplete="nickname" placeholder="例如：Katie Lu">
          <small>讓團主認得你，喊單才能對到你的帳號</small>
        </div>
        <div class="field">
          <label for="pw">密碼</label>
          <input class="input" id="pw" type="password" autocomplete="current-password" minlength="6" required>
          <small id="pwHint">忘記密碼請私訊團主幫你重設</small>
        </div>
        <button class="btn primary big" id="phoneBtn" type="submit">登入</button>
      </form>
    </div>
  </section>

  <!-- 已登入 -->
  <section id="v-me" hidden>
    <div class="who" style="justify-content:space-between;margin-bottom:6px">
      <span>你好，<b id="meName"></b></span>
      <span style="display:flex;gap:6px">
        <a class="btn small" id="adminLink" href="admin.html" hidden>後台</a>
        <button class="btn small" id="logout" type="button">登出</button>
      </span>
    </div>

    <div id="claimBox" hidden>
      <h2>這些喊單是你的嗎？</h2>
      <p class="hint">團主從社團匯入了以下名字的喊單，跟你的帳號對得上。確認是你的，就會放進你的帳戶。</p>
      <div class="card" id="claimList"></div>
    </div>

    <h2>我的喊單</h2>
    <div id="mine"><p class="loading">讀取中…</p></div>

    <h2>正在收單</h2>
    <p class="hint">按「+1」就會直接記進你的喊單，跟在社團留言一樣。</p>
    <div id="openProds" class="prods"><p class="loading">讀取中…</p></div>
  </section>

  <footer>
    好事丞雙 x 用插畫玩手作 ・ <a href="privacy.html">隱私權政策</a> ・ <a href="delete-data.html">刪除我的資料</a>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
